<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>PlayCanvas Web Components - Splat Gallery</title>
        <script type="importmap">
            {
                "imports": {
                    "@playcanvas/web-components": "../dist/pwc.mjs",
                    "playcanvas": "../node_modules/playcanvas/build/playcanvas.mjs"
                }
            }
        </script>
        <script type="module" src="../dist/pwc.mjs"></script>
        <link rel="stylesheet" href="css/example.css">
    </head>
    <body>
        <pc-app antialias="false" backend="webgl2" depth-buffer="false" max-pixel-ratio="1" stencil-buffer="false">
            <!-- Assets -->
            <pc-asset src="../node_modules/playcanvas/scripts/esm/camera-controls.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/gsplat/gsplat-flipbook.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/shadow-catcher.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-controllers.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-menu.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-navigation.mjs"></pc-asset>
            <pc-asset src="../node_modules/playcanvas/scripts/esm/xr/xr-session.mjs"></pc-asset>
            <pc-asset src="assets/scripts/scene-switcher.mjs"></pc-asset>
            <pc-asset src="assets/fonts/arial.json" type="font" id="arial-font"></pc-asset>
            <!-- Scene list: edit it with utils/splat-gallery.py -->
            <pc-asset src="assets/json/splat-gallery.json" id="gallery-scenes"></pc-asset>
            <!-- Skies: each scene picks its own -->
            <pc-asset src="assets/skies/sepulchral-chapel-rotunda-4k.webp" id="rotunda"></pc-asset>
            <pc-asset src="assets/skies/octagon-lamps-photo-studio-2k.hdr" id="studio" lazy></pc-asset>
            <!-- Splats: the first scene's preloads, the rest load the first time they're shown -->
            <pc-asset src="assets/splats/statues/angel.sog" id="angel"></pc-asset>
            <pc-asset src="assets/splats/statues/angel-kneeling.sog" id="angel-kneeling" lazy></pc-asset>
            <pc-asset src="assets/splats/statues/angel-with-candlestick.sog" id="angel-with-candlestick" lazy></pc-asset>
            <pc-asset src="assets/splats/statues/massa.sog" id="massa" lazy></pc-asset>
            <pc-asset src="assets/splats/statues/narcissus.sog" id="narcissus" lazy></pc-asset>
            <pc-asset src="assets/splats/statues/st-peter.sog" id="st-peter" lazy></pc-asset>
            <pc-asset src="assets/splats/statues/trumpet.sog" id="trumpet" lazy></pc-asset>
            <!-- Scene -->
            <pc-scene>
                <!-- Sky (switched per scene) -->
                <pc-sky asset="rotunda" type="dome" center="0 0.1 0" scale="20 20 20" lighting></pc-sky>
                <!-- Camera (with XR support) -->
                <pc-entity name="camera-root">
                    <pc-entity name="camera" position="-3.5 1.75 0">
                        <pc-camera far-clip="1500" fov="50" tonemap="aces"></pc-camera>
                        <pc-script>
                            <pc-script-instance name="cameraControls"
                                                enable-fly="false"
                                                enable-pan="true"
                                                focus-point="0 1.75 0"
                                                zoom-range="0.5 5"></pc-script-instance>
                        </pc-script>
                    </pc-entity>
                    <pc-script>
                        <pc-script-instance name="xrControllers"></pc-script-instance>
                        <pc-script-instance name="xrMenu" attributes='{
                            "menuItems": [
                                {"label": "Next scene", "eventName": "scene:next"},
                                {"label": "Previous scene", "eventName": "scene:prev"},
                                {"label": "Exit XR", "eventName": "xr:end"}
                            ],
                            "fontAsset": "asset:arial-font"
                        }'></pc-script-instance>
                        <pc-script-instance name="xrNavigation"></pc-script-instance>
                        <pc-script-instance name="xrSession"></pc-script-instance>
                    </pc-script>
                </pc-entity>
                <!-- Environments: a scene enables at most one of these -->
                <pc-entity name="environments">
                    <pc-entity name="studio" enabled="false">
                        <!-- Shadow Catcher -->
                        <pc-entity name="shadow-catcher">
                            <pc-render type="plane" cast-shadows="false"></pc-render>
                            <pc-script>
                                <pc-script-instance name="shadowCatcher" scale="10 10 10"></pc-script-instance>
                            </pc-script>
                        </pc-entity>
                        <!-- Lights -->
                        <pc-entity name="key-light" rotation="55 320 0">
                            <pc-light type="directional"
                                      cast-shadows shadow-bias="0.1" normal-offset-bias="0.05"
                                      shadow-distance="10" shadow-intensity="0.15"
                                      shadow-resolution="1024" shadow-type="pcf5-16f"></pc-light>
                        </pc-entity>
                        <pc-entity name="fill-light" rotation="55 220 0">
                            <pc-light type="directional"
                                      cast-shadows shadow-bias="0.1" normal-offset-bias="0.05"
                                      shadow-distance="10" shadow-intensity="0.15"
                                      shadow-resolution="1024" shadow-type="pcf5-16f"></pc-light>
                        </pc-entity>
                    </pc-entity>
                </pc-entity>
                <!-- Gallery: switch scenes with B (right controller) / Y (left), the XR menu, or N / P keys.
                     The scenes (pc-asset splats or flipbook folders) are listed in assets/json/splat-gallery.json. -->
                <pc-entity name="gallery">
                    <pc-script>
                        <pc-script-instance name="sceneSwitcher"
                                            environments="environments"
                                            scenes-asset="asset:gallery-scenes"></pc-script-instance>
                    </pc-script>
                </pc-entity>
            </pc-scene>
        </pc-app>
        <script type="module" src="js/example.mjs"></script>
        <script type="module">
            import { whenReady } from '@playcanvas/web-components';

            const { app } = await whenReady('pc-app');
            app.scene.gsplat.alphaClip = 0.1;
        </script>
    </body>
</html>
